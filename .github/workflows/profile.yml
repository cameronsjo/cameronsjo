name: Refresh profile stats

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats card and pins
        id: gen
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-profile.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg README.md
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: refresh profile stats and pins [skip-ci]"
            git push
          fi

      # Reminder: open an issue when STATS_TOKEN is within 14 days of expiry.
      # Skipped when running on the GITHUB_TOKEN fallback (no expiry emitted).
      - name: Remind before token expiry
        if: ${{ steps.gen.outputs.token_expiry_days != '' && fromJSON(steps.gen.outputs.token_expiry_days) <= 14 }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.gen.outputs.token_expiry_days }}
          EXP: ${{ steps.gen.outputs.token_expiry_at }}
        run: |
          title="STATS_TOKEN expires soon — rotate it"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Reminder issue #$existing already open — leaving it."
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s' \
            "\`STATS_TOKEN\` expires in **${DAYS} days** (on ${EXP})." \
            "Rotate it: \`./scripts/setup-stats-token.sh\` (or regenerate the PAT and run \`gh secret set STATS_TOKEN\`)." \
            "Until it lapses the weekly refresh keeps working; once expired, contributions fall back to public-only and this job starts failing. Close this issue after rotating.")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
